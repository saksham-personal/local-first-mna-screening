[package]
name = "mna-tools"
version = "0.1.0"
edition = "2021"
description = "Local-first deterministic M&A research tool service"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
scraper = "0.22"
futures-util = "0.3"
csv = "1.3"
calamine = "0.31"
rust_xlsxwriter = { version = "0.90", features = ["constant_memory"] }
parquet = { version = "57", default-features = false, features = ["snap"] }
regex = "1.12"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
http-body-util = "0.1"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
codegen-units = 16

