[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mna-orchestrator-offline"
version = "0.1.0"
description = "Offline LangGraph screening control-plane scaffold"
requires-python = ">=3.11"
dependencies = ["langgraph>=0.6.7,<2"]

[tool.setuptools.packages.find]
where = ["src"]
